services:
  db:
    image: postgres:16
    container_name: frs_db
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - frs_net
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Docker/django/Dockerfile
    container_name: frs_web
    restart: always
    env_file: .env
    environment:
      - IN_DOCKER=1
      # чтобы Django в контейнере гарантированно выбрал Postgres
      - POSTGRES_HOST=db
    command: uv run gunicorn FireService_DB.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - frs_net
    # healthcheck убран: curl может отсутствовать в образе

  nginx:
    image: nginx:alpine
    container_name: frs_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - frs_net
    # healthcheck убран: в nginx:alpine обычно нет curl

volumes:
  pg_data:
  static_volume:
  media_volume:

networks:
  frs_net:
    driver: bridge