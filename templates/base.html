<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}FRS | Base{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>

<body>
  {% block body %}
    <main class="container mt-4">
      {% block content %}{% endblock %}
    </main>
  {% endblock %}

  <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

{% if messages %}
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    {% for message in messages %}
      <div class="toast align-items-center text-bg-{% if 'error' in message.tags %}danger{% elif 'warning' in message.tags %}warning{% elif 'success' in message.tags %}success{% else %}primary{% endif %} border-0 mb-2"
           role="alert" aria-live="assertive" aria-atomic="true"
           data-bs-delay="2500" data-bs-autohide="true">
        <div class="d-flex">
          <div class="toast-body">{{ message }}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto"
                  data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    {% endfor %}
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".toast").forEach(el => {
        const t = new bootstrap.Toast(el);
        t.show();
      });
    });
  </script>
{% endif %}

</body>
</html>
