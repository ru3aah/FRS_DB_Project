<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}FRS | Base{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>

<body>
  {% block body %}
    <main class="container mt-4">
      {% block content %}{% endblock %}
    </main>
  {% endblock %}

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

  {% if messages %}
    <div class="modal fade"
         id="messagesModal"
         tabindex="-1"
         aria-labelledby="messagesModalLabel"
         aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title" id="messagesModalLabel">System message</h5>
          </div>

          <div class="modal-body">
            {% for message in messages %}
              <div class="alert mb-2 {% if 'error' in message.tags %}alert-danger{% elif 'warning' in message.tags %}alert-warning{% elif 'success' in message.tags %}alert-success{% else %}alert-primary{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
              OK
            </button>
          </div>

        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const modalEl = document.getElementById("messagesModal");
        if (!modalEl) return;

        const modal = new bootstrap.Modal(modalEl, {
          backdrop: "static",
          keyboard: false
        });

        modal.show();
      });
    </script>
  {% endif %}
</body>
</html>
