{% extends "base.html" %}
{% block title %}FRS DB | Transport{% endblock %}

{% block content %}
    {% include "includes/navbar.html" %}

    <div class="container mt-4">

        <!-- Logo -->
        <div class="row text-center mb-4">
            <div class="col">
                <img src="/static/img/logos/frs_logo.png"
                     alt="FRS logo"
                     class="img-fluid"
                     width="180">
            </div>
        </div>

        <!-- Title -->
        <div class="row text-center mb-4">
            <div class="col">
                <h1>Transport Management</h1>
            </div>
        </div>

        <div class="row g-3">

            <!-- Unit types -->
            <div class="col-md-3">
                <a href="{% url 'transport:type_list' %}"
                   class="card text-decoration-none h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Types</h5>
                        <p class="card-text text-muted">Manage unit
                            types</p>
                    </div>
                </a>
            </div>

            <!-- Unit models -->
            <div class="col-md-3">
                <a href="{% url 'transport:model_list' %}"
                   class="card text-decoration-none h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Models</h5>
                        <p class="card-text text-muted">Manage unit models</p>
                    </div>
                </a>
            </div>

            <!-- Transport Units -->
            <div class="col-md-3">
                <a href="{% url 'transport:unit_list' %}"
                   class="card text-decoration-none h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Units</h5>
                        <p class="card-text text-muted">Manage units</p>
                    </div>
                </a>
            </div>

        </div>
    </div>
{% endblock %}
